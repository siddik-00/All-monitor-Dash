fullnameOverride: observability
grafana:
  fullnameOverride: grafana
  service:
    type: ClusterIP
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: monitoring
  additionalDataSources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki-gateway.monitoring.svc.cluster.local
    jsonData:
      derivedFields:
      - datasourceUid: tempo
        matcherRegex: '"traceId":"([a-f0-9]+)"'
        name: TraceID
        url: $${__value.raw}
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo.monitoring.svc.cluster.local:3200
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    retention: 7d
    retentionSize: 15GB
    externalLabels:
      cluster: my-cluster
    resources:
      requests:
        cpu: 300m
        memory: 1Gi
      limits:
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
    serviceMonitorSelectorNilUsesHelmValues: false
alertmanager:
  service:
    type: ClusterIP
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: 'null'
      group_by:
      - alertname
      - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
    - name: 'null'
additionalPrometheusRulesMap:
  control-api:
    groups:
    - name: platform.api
      rules:
      - alert: ControlAPIUnavailable
        expr: up{namespace="platform-system",service="control-api"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Control API scrape is unavailable.
      - alert: ControlAPIErrorRate
        expr: sum(rate(control_api_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(control_api_http_requests_total[5m])),
          0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Control API error ratio is above 5 percent.
