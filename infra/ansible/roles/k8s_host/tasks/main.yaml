---
- name: Require a supported Ubuntu host
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_version is version('22.04', '>=')
    fail_msg: This role prepares Ubuntu 22.04+ hosts only.
- name: Install host prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl, conntrack, socat]
    state: present
    update_cache: true
    cache_valid_time: 3600
- name: Persist Kubernetes networking modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/devops-k8s.conf
    content: "overlay\nbr_netfilter\n"
    owner: root
    group: root
    mode: '0644'
- name: Load modules
  ansible.builtin.command: "modprobe {{ item }}"
  loop: [overlay, br_netfilter]
  changed_when: false
  when: not ansible_check_mode
- name: Persist forwarding settings
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-devops-k8s.conf
    content: |
      net.ipv4.ip_forward = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
    owner: root
    group: root
    mode: '0644'
  register: forwarding_config
- name: Apply changed forwarding settings
  ansible.builtin.command: sysctl --system
  changed_when: true
  when: forwarding_config.changed and not ansible_check_mode
