{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "control-api.name" . }}
  labels:
    {{- include "control-api.labels" . | nindent 4 }}
    release: {{ .Values.serviceMonitor.release | quote }}
spec:
  selector:
    matchLabels:
      {{- include "control-api.selector" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
{{- end }}
