replicaCount: 2
image:
  repository: "" # Required: ghcr.io/YOUR_ORG/control-api
  tag: "" # Required: immutable CI commit tag
  digest: "" # Optional: sha256:...; overrides tag when set
  pullPolicy: IfNotPresent
imagePullSecrets: []
clusterName: my-cluster
api:
  existingSecret: control-api-auth
  secretKey: api-token
  allowedOrigins: [] # Exact origins, including scheme, no trailing slash
  prometheusUrl: http://observability-prometheus.monitoring.svc.cluster.local:9090
  logsEnabled: false
tools:
  argocdUrl: "" # Enable with a read-only Argo CD token in upstreamSecret.
  grafanaUrl: http://grafana.monitoring.svc.cluster.local
  lokiUrl: http://loki.monitoring.svc.cluster.local:3100
  tempoUrl: http://tempo.monitoring.svc.cluster.local:3200
  alertmanagerUrl: http://observability-alertmanager.monitoring.svc.cluster.local:9093
  alloyUrl: http://alloy.monitoring.svc.cluster.local:12345
  otelHealthUrl: http://otel-collector.monitoring.svc.cluster.local:13133
  otlpTracesEndpoint: http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces
  upstreamSecret: "" # Optional: argocd-token and grafana-token keys.
  argocdCAFile: "" # Optional: /var/run/secrets/toolchain/argocd-ca.crt
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
service:
  port: 8080
ingress:
  enabled: false
  className: "" # Use an existing controller
  annotations: {}
  host: ""
  tlsSecretName: ""
autoscaling:
  enabled: false # Requires metrics-server
  minReplicas: 2
  maxReplicas: 6
  cpuTarget: 70
pdb:
  enabled: true
  minAvailable: 1
serviceMonitor:
  enabled: false # Enable after installing kube-prometheus-stack CRDs
  release: observability
networkPolicy:
  enabled: false # Configure cluster-specific API CIDRs and ingress namespace first
  ingressNamespace: ingress-system
  monitoringNamespace: monitoring
  apiServerCIDRs: [] # Actual API endpoint IPs/CIDRs, as observed by your CNI
nodeSelector: {}
tolerations: []
