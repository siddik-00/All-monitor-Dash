services:
  workflow:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports: ['127.0.0.1:8080:8080']
    environment:
      DEMO_MODE: 'true'
      HOST: 0.0.0.0
      PORT: '8080'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
