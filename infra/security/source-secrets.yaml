# Apply after External Secrets CRDs are installed. The actual source Secret is
# generated locally by scripts/create-secrets.sh and never committed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-source-reader
  namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-secret-source
  namespace: platform-secrets
rules:
  - apiGroups: ['']
    resources: [secrets]
    # ESO checks read permissions for its dedicated source namespace.
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-secret-source
  namespace: platform-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-secret-source
subjects:
  - kind: ServiceAccount
    name: eso-source-reader
    namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eso-source-self-review
rules:
  - apiGroups: [authorization.k8s.io]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eso-source-self-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eso-source-self-review
subjects:
  - kind: ServiceAccount
    name: eso-source-reader
    namespace: platform-system
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: platform-kubernetes-source
  namespace: platform-system
spec:
  provider:
    kubernetes:
      remoteNamespace: platform-secrets
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-source-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: control-api-auth
  namespace: platform-system
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: platform-kubernetes-source
    kind: SecretStore
  target:
    name: control-api-auth
    creationPolicy: Owner
  data:
    - secretKey: api-token
      remoteRef:
        key: control-api-source
        property: api-token
